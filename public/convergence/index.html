<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수렴 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --panel:#151A21; --panel-2:#1B222B; --panel-3:#212A35;
  --line:#242C36; --line-2:#2F3945;
  --ink:#E8EDF3; --ink-2:#94A3B0; --ink-3:#5D6B7A;
  --accent:#2563EB;
  --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --none:#3F4A57;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.top{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(180deg,#131922,#0E1116)}
h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.spacer{flex:1}
.btn{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn.pri{color:#fff;background:var(--accent);border-color:var(--accent)}
.btn.on{color:var(--ink);border-color:var(--line-2);background:var(--panel-3)}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:0;min-height:calc(100vh - 57px)}
.left{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow-y:auto}
.right{padding:16px 20px;overflow-y:auto}
.sh{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 9px}
/* 케이스 리스트 */
.case{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:10px 11px;margin-bottom:8px;cursor:pointer}
.case:hover{border-color:var(--line-2)}
.case.cur{border-color:var(--accent)}
.case .r1{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.dot.run{background:var(--warn);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
.case .id{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.case .eng{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.case .ttl{font-size:12.5px;margin-top:4px;color:var(--ink)}
.case .met{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;white-space:pre-wrap}
.case .go{margin-left:auto}
.empty{color:var(--ink-3);font-size:12.5px;padding:14px 6px;text-align:center}
/* 매트릭스 */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
th{color:var(--ink-3);font-weight:500;text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
td{padding:6px 9px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tr.cur td{background:var(--panel-2)}
td.ok{color:var(--ok)} td.bad{color:var(--bad)} td.warn{color:var(--warn)}
/* 궤적 */
.traj{margin-top:18px}
.thead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.thead .name{font-family:var(--mono);font-size:13px;color:var(--ink)}
.live{font-family:var(--mono);font-size:10px;color:var(--warn)}
.live::before{content:'●';margin-right:4px;animation:pulse 1.1s infinite}
.chart{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:11px 13px;margin-bottom:11px}
.chart.sig{border-color:var(--line-2);background:linear-gradient(180deg,#171E27,var(--panel))}
.chead{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.ctitle{font-size:12px;font-weight:600}
.csub{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.legend{margin-left:auto;display:flex;gap:11px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
svg{display:block;width:100%;overflow:visible}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
/* 모달 */
.mback{display:none;position:fixed;inset:0;background:rgba(5,8,12,.72);z-index:80}
.mback.on{display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(680px,100%);
  max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mhead b{font-size:14px}
.mhead input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);
  font-family:var(--mono);font-size:12px;padding:7px 10px;outline:none}
.mbody{overflow-y:auto;padding:8px 10px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:7px;cursor:pointer}
.mrow:hover{background:var(--panel-2)}
.mrow input{accent-color:var(--accent);width:15px;height:15px;flex:none}
.mrow .mid{font-family:var(--mono);font-size:11px;color:var(--ink-2);width:120px;flex:none}
.mrow .mt{font-size:12.5px;color:var(--ink)}
.mrow .mw{font-size:11px;color:var(--ink-3)}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.left{border-right:none;border-bottom:1px solid var(--line)}.g2{grid-template-columns:1fr}}
</style></head><body>

<div class="top">
  <h1>수렴 테스트</h1><span class="tag" id="stat">—</span>
  <span class="spacer"></span>
  <button class="btn pri" id="pick">+ 케이스 선택</button>
  <button class="btn" id="reload">새로고침</button>
</div>

<div class="wrap">
  <div class="left">
    <div class="sh">실행 대상 <span class="tag" id="nsel"></span></div>
    <div id="list"></div>
  </div>
  <div class="right">
    <div class="sh">매트릭스</div>
    <table id="mx"><thead><tr>
      <th>케이스</th><th>상태</th><th>metric</th><th>비고</th>
    </tr></thead><tbody></tbody></table>

    <div class="traj" id="traj" style="display:none">
      <div class="thead">
        <div class="name" id="tname"></div>
        <span class="tag" id="tinfo"></span>
        <span class="live" id="tlive" style="display:none">LIVE</span>
      </div>

      <div class="chart sig">
        <div class="chead"><div class="ctitle">Residual — 출력 스텝 dt</div>
          <div class="csub">로그축 · 바닥 붕괴 = 스텝붕괴/크롤</div>
          <div class="legend"><span><i style="background:#F59E0B"></i>dt [s]</span></div></div>
        <svg id="c_dt" viewBox="0 0 760 150"></svg>
      </div>
      <div class="g2">
        <div class="chart">
          <div class="chead"><div class="ctitle">RMC 드리프트</div>
            <div class="csub" id="msub">M_total</div>
            <div class="legend"><span><i style="background:#8B5CF6"></i>드리프트 %</span></div></div>
          <svg id="c_m" viewBox="0 0 370 140"></svg>
        </div>
        <div class="chart">
          <div class="chead"><div class="ctitle">압력</div><div class="csub">[bar]</div>
            <div class="legend"><span><i style="background:#EF4444"></i>Pc</span>
              <span><i style="background:#38BDF8"></i>Pe</span></div></div>
          <svg id="c_p" viewBox="0 0 370 140"></svg>
        </div>
        <div class="chart">
          <div class="chead"><div class="ctitle">과열도</div><div class="csub">[K]</div>
            <div class="legend"><span><i style="background:#2563EB"></i>SH</span></div></div>
          <svg id="c_sh" viewBox="0 0 370 140"></svg>
        </div>
        <div class="chart">
          <div class="chead"><div class="ctitle">EEV · 주파수</div><div class="csub">개도 / f</div>
            <div class="legend"><span><i style="background:#22C55E"></i>EEV</span>
              <span><i style="background:#94A3B0"></i>f</span></div></div>
          <svg id="c_e" viewBox="0 0 370 140"></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mback" id="mback"><div class="modal">
  <div class="mhead"><b>케이스 선택</b><input id="q" placeholder="검색 — id · 제목"></div>
  <div class="mbody" id="mbody"></div>
  <div class="mfoot">
    <button class="btn" id="mnone">모두 해제</button>
    <button class="btn pri" id="mok">저장</button>
  </div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const API='/api/convergence';
let PLAN=[], SEL=new Set(JSON.parse(localStorage.getItem('conv.sel')||'[]'));
let CUR=null, POLL=null, RUNNING=new Set();

async function j(u,o){const r=await fetch(u,o); if(!r.ok) throw new Error(r.status); return r.json();}

async function loadPlan(){
  try{
    const p=await j(API+'/plan'); PLAN=p.items||[];
    $('#stat').textContent=PLAN.length+' 케이스 · 백엔드 OK';
  }catch(e){ $('#stat').textContent='백엔드 없음 — uvicorn convergence_api 필요'; PLAN=[]; }
  renderList(); renderMx();
}

function stDot(it){ if(RUNNING.has(it.id)) return 'run';
  const s=(it.state||'')+((it.prev&&it.prev.status)||'');
  if(/ok|pass|완주/.test(s)) return 'ok'; if(/bad|fail|실패/.test(s)) return 'bad'; return ''; }

function renderList(){
  $('#nsel').textContent=SEL.size+'개';
  const box=$('#list'); box.innerHTML='';
  const items=PLAN.filter(i=>SEL.has(i.id));
  if(!items.length){ box.innerHTML='<div class="empty">선택된 케이스 없음<br>[+ 케이스 선택]으로 추가</div>'; return; }
  for(const it of items){
    const d=document.createElement('div'); d.className='case'+(CUR===it.id?' cur':'');
    d.innerHTML=`<div class="r1"><span class="dot ${stDot(it)}"></span>
      <span class="id">${it.id}</span><span class="eng">${it.engine||'?'}</span>
      <button class="btn go" data-run="${it.id}">${RUNNING.has(it.id)?'실행중…':'실행'}</button></div>
      <div class="ttl">${it.title||''}</div>
      <div class="met">${(it.state||'').slice(0,110)}</div>`;
    d.onclick=e=>{ if(e.target.dataset.run) return; CUR=it.id; renderList(); renderMx(); showTraj(it); };
    d.querySelector('[data-run]').onclick=e=>{e.stopPropagation(); runItem(it);};
    box.appendChild(d);
  }
}

function renderMx(){
  const tb=$('#mx tbody'); tb.innerHTML='';
  for(const it of PLAN.filter(i=>SEL.has(i.id))){
    const tr=document.createElement('tr'); if(CUR===it.id) tr.className='cur';
    const st=RUNNING.has(it.id)?'실행중':(stDot(it)||'대기');
    const cls=st==='ok'?'ok':st==='bad'?'bad':st==='실행중'?'warn':'';
    const pv=it.prev||{};
    tr.innerHTML=`<td>${it.id}</td><td class="${cls}">${st}</td>
      <td>${pv.metric||'—'}</td><td>${(pv.note||it.check||'').slice(0,72)}</td>`;
    tr.onclick=()=>{CUR=it.id; renderList(); renderMx(); showTraj(it);};
    tb.appendChild(tr);
  }
}

async function runItem(it){
  if(RUNNING.has(it.id)) return;
  RUNNING.add(it.id); CUR=it.id; renderList(); renderMx(); showTraj(it);
  const pr=j(API+'/plan/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan_id:it.id,opts_patch:{}})}).catch(e=>({status:'bad',note:''+e}));
  const res=await pr;
  RUNNING.delete(it.id);
  it.prev={status:res.status,metric:res.metric,note:res.note};
  renderList(); renderMx(); poll(it,true);
}

function showTraj(it){
  $('#traj').style.display='block';
  $('#tname').textContent=it.id+' — '+(it.title||'');
  if(POLL) clearInterval(POLL);
  poll(it,true);
  POLL=setInterval(()=>poll(it,false),3000);
}

async function poll(it,force){
  try{
    const s=await j(API+'/series/'+encodeURIComponent(it.recipe));
    if(!s.exists){ $('#tinfo').textContent=s.note||'결과 없음'; return; }
    $('#tinfo').textContent=`t=${(+s.t_end).toFixed(1)}s · ${s.rows}행 · ${s.file}`;
    $('#tlive').style.display=(s.live||RUNNING.has(it.id))?'':'none';
    if(!s.live&&!RUNNING.has(it.id)&&!force&&POLL){clearInterval(POLL);POLL=null;}
    drawAll(s.series);
  }catch(e){ $('#tinfo').textContent='series 오류: '+e; }
}

function drawAll(S){
  const t=S.t||[];
  draw('c_dt',[{v:S.dt,c:'#F59E0B'}],{t,log:true});
  draw('c_m',[{v:S.drift_pct,c:'#8B5CF6'}],{t,zero:true});
  if(S.M_total) $('#msub').textContent='M 종점 '+(S.M_total[S.M_total.length-1]*1000).toFixed(2)+' g';
  draw('c_p',[{v:S.Pc_bar,c:'#EF4444'},{v:S.Pe_bar,c:'#38BDF8'}],{t});
  draw('c_sh',[{v:S.SH,c:'#2563EB'}],{t,zero:true});
  draw('c_e',[{v:S.eev,c:'#22C55E'},{v:S.f,c:'#94A3B0'}],{t});
}

function draw(id,series,opt={}){
  const svg=$('#'+id), vb=svg.viewBox.baseVal, W=vb.width, H=vb.height;
  const t=opt.t||[], P={l:46,r:8,tp:8,b:18};
  series=series.filter(s=>s.v&&s.v.some(x=>x!=null));
  if(!t.length||!series.length){svg.innerHTML='';return;}
  let vals=series.flatMap(s=>s.v).filter(x=>x!=null&&isFinite(x));
  const tf=opt.log?(x=>Math.log10(Math.max(x,1e-14))):(x=>x);
  vals=vals.map(tf);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(opt.zero&&!opt.log){lo=Math.min(lo,0);hi=Math.max(hi,0);}
  if(hi-lo<1e-12){hi=lo+1;}
  const pad=(hi-lo)*.07; lo-=pad; hi+=pad;
  const t0=t[0], t1=t[t.length-1]||1;
  const X=i=>P.l+(t[i]-t0)/(t1-t0||1)*(W-P.l-P.r);
  const Y=v=>P.tp+(1-(tf(v)-lo)/(hi-lo))*(H-P.tp-P.b);
  let g='';
  for(let k=0;k<=3;k++){
    const yy=P.tp+k/3*(H-P.tp-P.b), vv=hi-(hi-lo)*k/3;
    const lab=opt.log?('1e'+vv.toFixed(0)):Math.abs(vv)>=100?vv.toFixed(0):vv.toFixed(2);
    g+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#242C36" stroke-width="1"/>`;
    g+=`<text x="${P.l-6}" y="${yy+3.5}" fill="#5D6B7A" font-size="9" font-family="JetBrains Mono" text-anchor="end">${lab}</text>`;
  }
  if(opt.zero&&!opt.log&&lo<0&&hi>0)
    g+=`<line x1="${P.l}" y1="${Y(0)}" x2="${W-P.r}" y2="${Y(0)}" stroke="#3F4A57" stroke-dasharray="3 3"/>`;
  for(const s of series){
    let d='',pen=false;
    for(let i=0;i<t.length;i++){const v=s.v[i];
      if(v==null||!isFinite(v)){pen=false;continue;}
      d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true;}
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.6"/>`;
  }
  g+=`<text x="${W-P.r}" y="${H-4}" fill="#5D6B7A" font-size="9" font-family="JetBrains Mono" text-anchor="end">t=${t1.toFixed(1)}s</text>`;
  svg.innerHTML=g;
}

/* 모달 */
function openModal(){
  $('#mback').classList.add('on'); $('#q').value=''; renderModal('');
  $('#q').focus();
}
function renderModal(q){
  const b=$('#mbody'); b.innerHTML='';
  for(const it of PLAN){
    const hay=(it.id+' '+(it.title||'')).toLowerCase();
    if(q&&!hay.includes(q)) continue;
    const r=document.createElement('label'); r.className='mrow';
    r.innerHTML=`<input type="checkbox" ${SEL.has(it.id)?'checked':''} data-id="${it.id}">
      <span class="mid">${it.id}</span>
      <span><div class="mt">${it.title||''}</div><div class="mw">${(it.why||'').slice(0,90)}</div></span>`;
    r.querySelector('input').onchange=e=>{e.target.checked?SEL.add(it.id):SEL.delete(it.id);};
    b.appendChild(r);
  }
  if(!b.children.length) b.innerHTML='<div class="empty">일치하는 케이스 없음</div>';
}
$('#pick').onclick=openModal;
$('#q').oninput=e=>renderModal(e.target.value.trim().toLowerCase());
$('#mnone').onclick=()=>{SEL.clear(); renderModal($('#q').value.trim().toLowerCase());};
$('#mok').onclick=()=>{
  localStorage.setItem('conv.sel',JSON.stringify([...SEL]));
  $('#mback').classList.remove('on'); renderList(); renderMx();
};
$('#mback').onclick=e=>{if(e.target===$('#mback'))$('#mok').click();};
$('#reload').onclick=loadPlan;
loadPlan();
</script></body></html>
